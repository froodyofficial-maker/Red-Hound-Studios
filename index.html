<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Red Hound Studios</title>
<meta name="description" content="Red Hound Studios: fan-made films, franchises and lore.">
<meta name="theme-color" content="#0b0908">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: streaming-service shell. Sticky top bar, a hero on every page, horizontal rows below. Each film, actor and franchise has its own page (#/film/…, #/actor/…, #/franchise/…). */
:root{
  --bg:#0b0908; --bg-2:#141110; --surface:#1c1716; --line:#2c2422;
  --fg:#f3ede9; --muted:#a39893; --dim:#6f6460;
  --hound:#d3262e; --hound-deep:#7a1016;
  --ecto:#7ee06a; --felt:#1f8a6a;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(16px, env(safe-area-inset-left,0px));
  --gutR:max(16px, env(safe-area-inset-right,0px));
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hound);outline-offset:3px;border-radius:6px}
[tabindex="-1"]:focus{outline:none}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;align-items:center;gap:28px;padding:14px var(--gutR) 14px var(--gut);background:linear-gradient(to bottom,rgba(11,9,8,.95),rgba(11,9,8,0));transition:background .35s var(--ease)}
.bar.solid{background:rgba(11,9,8,.96);box-shadow:0 1px 0 var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--display);font-size:26px;letter-spacing:.06em;color:var(--hound);line-height:1;font-weight:400}
.brand span{font-family:var(--display);font-size:26px;letter-spacing:.06em;line-height:1;color:var(--fg)}
.nav{display:flex;gap:18px;font-size:13px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.nav a{text-decoration:none;transition:color .2s}
.nav a:hover,.nav a.cur{color:var(--fg)}
@media (max-width:640px){.bar{flex-wrap:wrap;gap:10px 20px}.updates{top:calc(104px + env(safe-area-inset-top,0px))}.nav{order:2;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:20px;font-size:14px;padding-bottom:2px}.nav::-webkit-scrollbar{display:none}.nav a{white-space:nowrap}.hero{margin-top:-96px}.hero-in{padding-top:140px}}

/* Hero */
.hero{position:relative;margin-top:-64px;min-height:min(78vh,680px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate}
.hero-art{position:absolute;inset:0;z-index:-1}
.hero-art canvas{position:absolute;inset:0;width:100%;height:100%;display:block;mix-blend-mode:screen}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.08);transition:opacity 1.4s var(--ease),transform 8s var(--ease)}
.hero-art img.on{opacity:.6;transform:scale(1)}
.hero-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,9,8,.92) 0%,rgba(11,9,8,.55) 45%,rgba(11,9,8,.1) 100%),linear-gradient(0deg,var(--bg) 0%,rgba(11,9,8,0) 40%)}
.hero-in{padding:120px var(--gutR) 56px var(--gut);max-width:760px;display:grid;gap:16px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--hound);box-shadow:0 0 12px var(--hound)}
.hero h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(56px,10vw,120px);line-height:.88;letter-spacing:.01em;text-wrap:balance}
.hero h1 small{display:block;font-size:.42em;color:var(--ecto);letter-spacing:.08em}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:12px;color:var(--fg);background:rgba(255,255,255,.04)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border-radius:6px;border:0;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer;transition:transform .25s var(--ease),background .2s,box-shadow .25s}
.btn svg{width:18px;height:18px}
.btn.play{background:var(--fg);color:#0b0908}
.btn.play:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(211,38,46,.35);background:#fff}
.btn.ghost{background:rgba(120,110,105,.32);color:var(--fg);backdrop-filter:blur(6px)}
.btn.ghost:hover{background:rgba(120,110,105,.5);transform:translateY(-2px)}

/* load sequence (starts visible-safe: only transform/opacity from near-rest) */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hero-in>*{animation:rise .8s var(--ease) both}
.hero-in>*:nth-child(2){animation-delay:.08s}.hero-in>*:nth-child(3){animation-delay:.16s}.hero-in>*:nth-child(4){animation-delay:.24s}
.row{animation:rise .8s var(--ease) both;animation-delay:.3s}
.row+.row{animation-delay:.4s}
.row+.row+.row{animation-delay:.5s}

/* Rows */
main{display:grid;gap:40px;padding-block:8px 72px}
main>*{min-width:0;scroll-margin-top:calc(72px + env(safe-area-inset-top,0px))}
.row-h{display:flex;align-items:baseline;gap:14px;padding:0 var(--gutR) 0 var(--gut);flex-wrap:wrap}
.row-h h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.04em;line-height:1}
.row-h p{margin:0;font-size:13px;color:var(--dim);font-weight:600}
.row-h .tag{width:10px;height:10px;border-radius:2px;align-self:center}
.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:18px var(--gutR) 26px var(--gut);scroll-padding-left:var(--gut);scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.card{flex:0 0 auto;width:clamp(150px,18vw,210px);scroll-snap-align:start;position:relative;border:0;padding:0;background:none;cursor:pointer;text-align:left;transition:transform .45s var(--ease)}
.card .poster{aspect-ratio:2/3;max-width:100%;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);transition:box-shadow .45s var(--ease)}
.card:hover,.card:focus-visible{transform:scale(1.06) translateY(-4px)}
.card:hover .poster,.card:focus-visible .poster{box-shadow:0 22px 50px rgba(0,0,0,.7),0 0 0 2px var(--hound)}
.card .cap{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:13px;font-weight:700}
.card .cap span:last-child{color:var(--dim);font-variant-numeric:tabular-nums}
.top .card{width:auto;display:flex;align-items:flex-end;gap:0}
.top .rank{font-family:var(--display);font-size:clamp(130px,16vw,200px);line-height:.72;color:var(--bg);-webkit-text-stroke:3px #5a4a46;margin-right:-14px;letter-spacing:-.04em;transition:-webkit-text-stroke-color .4s var(--ease),transform .45s var(--ease);user-select:none}
.top .card:hover .rank,.top .card:focus-visible .rank{-webkit-text-stroke-color:var(--hound);transform:translateX(-6px)}
.top .card>div:last-child{width:clamp(130px,15vw,180px);position:relative}
.top .rank-1{-webkit-text-stroke-color:#f5c518}
.views{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.pop{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0b0908;background:#f5c518;border-radius:4px;padding:3px 8px;align-self:center}
.face{border-radius:50%;overflow:hidden;aspect-ratio:1;background:var(--surface);box-shadow:0 0 0 2px var(--line)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.actor{flex:0 0 auto;width:clamp(104px,11vw,132px);border:0;background:none;padding:0;cursor:pointer;display:grid;gap:10px;justify-items:center;align-content:start;text-align:center;scroll-snap-align:start;transition:transform .45s var(--ease)}
.actor .face{width:100%;transition:box-shadow .35s var(--ease)}
.actor:hover,.actor:focus-visible{transform:translateY(-6px)}
.actor:hover .face,.actor:focus-visible .face{box-shadow:0 0 0 3px var(--hound),0 16px 40px rgba(0,0,0,.6)}
.actor b{font-size:13px;font-weight:700;line-height:1.25}
.actor small{display:block;font-size:11px;color:var(--dim);font-weight:600;margin-top:2px}
.cast{display:flex;gap:16px;flex-wrap:wrap}
.cast .actor{width:84px}
.cast .actor b{font-size:12px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font-size:13px;font-weight:700;text-decoration:none;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line);transition:background .2s}
.links a:hover{background:var(--hound-deep)}
.bell{margin-left:auto;position:relative;flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.07);display:grid;place-items:center;cursor:pointer;transition:background .2s,transform .25s var(--ease)}
.bell:hover{background:rgba(255,255,255,.14);transform:rotate(-8deg)}
.bell .n{position:absolute;top:-3px;right:-3px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--hound);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg)}
.updates{position:fixed;z-index:70;top:calc(66px + env(safe-area-inset-top,0px));right:var(--gutR);width:min(380px,calc(100vw - 32px));max-height:70vh;overflow:auto;background:var(--bg-2);border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 1px var(--line);padding:16px;display:grid;gap:10px;opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .25s var(--ease),transform .3s var(--ease)}
.updates.on{opacity:1;transform:none;pointer-events:auto}
.updates h4{margin:0;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.upd{display:grid;gap:4px;text-decoration:none;padding:10px 12px;border-radius:8px;background:var(--surface);font-size:14px;color:var(--muted);transition:background .2s}
.upd:hover{background:#261f1d}
.upd.new{color:var(--fg);box-shadow:inset 3px 0 0 var(--hound)}
.when{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.soon{flex:0 0 auto;width:min(560px,86vw);display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;align-items:center;padding:14px;border-radius:12px;background:linear-gradient(120deg,rgba(211,38,46,.16),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px var(--line);scroll-snap-align:start;transition:transform .45s var(--ease),box-shadow .35s}
.soon:hover{transform:translateY(-4px);box-shadow:inset 0 0 0 1px var(--hound),0 20px 50px rgba(0,0,0,.5)}
.soon>.poster{aspect-ratio:2/3;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.soon-body{display:grid;gap:8px;justify-items:start;min-width:0}
.soon-t{font-family:var(--display);font-size:clamp(28px,3vw,38px);line-height:.95;letter-spacing:.02em;text-decoration:none}
.soon-t:hover{color:#fff}
.soon-r{font-size:13px;font-weight:700;color:var(--muted)}
.soon-body p{margin:0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.soon-chip{background:var(--hound);border-color:var(--hound);color:#fff;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
.btn.follow{padding:10px 18px;font-size:14px}
.btn.follow.on{background:var(--hound);color:#fff}
.ulist{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:68ch;border-left:2px solid var(--line)}
.ulist li{padding-left:18px;position:relative;display:grid;gap:4px}
.ulist li::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--hound)}
.ulist p{margin:0;color:var(--muted)}
@media (max-width:520px){.soon{grid-template-columns:100px minmax(0,1fr);gap:14px}}
.empty{margin:18px var(--gutR) 0 var(--gut);border:1px dashed var(--line);border-radius:8px;padding:28px 22px;color:var(--muted);font-size:14px;max-width:520px;display:grid;gap:4px}
.empty strong{color:var(--fg);font-size:15px}

/* Generated poster art */
.gp{width:100%;height:100%;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:14px 12px;background:var(--surface);overflow:hidden}
.gp::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 110%,var(--glow) 0%,transparent 60%),radial-gradient(80% 50% at 80% 0%,rgba(211,38,46,.25),transparent 70%)}
.gp>*{position:relative}
.gp .num{font-family:var(--display);font-size:clamp(90px,11vw,130px);line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--glow);opacity:.9}
.gp .t1{font-family:var(--display);font-size:13px;letter-spacing:.24em;color:var(--muted)}
.gp .t2{font-family:var(--display);font-size:clamp(28px,3.4vw,40px);line-height:.9;letter-spacing:.03em}
.gp .stu{font-size:9px;font-weight:800;letter-spacing:.22em;color:var(--hound);text-transform:uppercase}
.poster img{width:100%;height:100%;object-fit:cover;display:block}

/* Pages */
#app{transition:opacity .22s var(--ease),transform .22s var(--ease)}
#app.leaving{opacity:0;transform:translateY(10px)}
a.card,a.actor{text-decoration:none;color:inherit}
a.card{display:block}
.top a.card{display:flex}
.hero.sub{min-height:min(66vh,580px)}
.hero.slim{min-height:0}
.hero-art img.soft{filter:blur(28px) saturate(1.3);opacity:0}
.hero-art img.soft.on{opacity:.45;transform:scale(1.2)}
.hero-in.wide{max-width:1180px;width:100%}
.film-head{display:grid;grid-template-columns:230px minmax(0,1fr);gap:36px;align-items:end}
.film-head>.poster{aspect-ratio:2/3;border-radius:10px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.07)}
.film-head .info,.person-head .info{display:grid;gap:14px;min-width:0}
.hero h1.t2{font-size:clamp(46px,7vw,100px)}
.crumbs{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.crumbs a{text-decoration:none;transition:color .2s}
.crumbs a:hover{color:var(--fg)}
.crumbs i{font-style:normal;color:var(--dim)}
.person-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center}
.person-head>.face{width:clamp(150px,19vw,240px);box-shadow:0 0 0 4px var(--hound),0 30px 70px rgba(0,0,0,.75)}
.stats{display:flex;flex-wrap:wrap;gap:12px 32px}
.stats div{display:grid;gap:2px}
.stats b{font-family:var(--display);font-weight:400;font-size:38px;line-height:1;letter-spacing:.02em}
.stats span{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.pg{padding:0 var(--gutR) 0 var(--gut);display:grid;gap:14px;max-width:1180px}
.pg>h2,.split h2{margin:0;font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.04em;line-height:1}
.pg p.lead{margin:0;max-width:68ch;color:var(--muted);font-size:16px;line-height:1.7}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:28px 48px;align-items:start}
.split>div{display:grid;gap:14px;min-width:0}
.see{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;transition:color .2s,transform .25s var(--ease)}
.see:hover{color:var(--fg);transform:translateX(3px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 18px;padding:18px var(--gutR) 0 var(--gut)}
.grid .card{width:auto}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:30px 16px;padding:18px var(--gutR) 0 var(--gut)}
.agrid .actor{width:auto}
.none{margin:0;color:var(--muted)}
@media (max-width:860px){.split{grid-template-columns:1fr}}
@media (max-width:640px){.film-head{grid-template-columns:1fr;gap:22px}.film-head>.poster{width:150px}.person-head{grid-template-columns:1fr;gap:22px}}
.sec h4{margin:0 0 8px;font-size:11px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.sec p{margin:0;max-width:65ch;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border-radius:8px;overflow:hidden}
.facts div{background:var(--bg-2);padding:12px 14px;display:grid;gap:2px}
.facts dt{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.facts dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
.timeline{display:flex;gap:6px;flex-wrap:wrap}
.timeline span,.timeline a{display:inline-block;border:0;cursor:default;min-width:34px;text-align:center;padding:6px 0;border-radius:4px;font-size:12px;font-weight:800;background:var(--surface);color:var(--dim);font-variant-numeric:tabular-nums}
.timeline .has{color:var(--fg);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:background .2s,transform .25s var(--ease)}
.timeline .has:hover{background:var(--hound-deep);transform:translateY(-2px)}
.timeline span.cur{background:var(--hound);color:#fff}

/* Player */
.player{position:fixed;inset:0;z-index:120;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(1.04);transition:opacity .45s var(--ease),transform .55s var(--ease)}
.player.on{opacity:1;pointer-events:auto;transform:none}
.player-top{display:flex;align-items:center;gap:14px;padding:calc(12px + env(safe-area-inset-top,0px)) var(--gutR) 12px var(--gut)}
.pback{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.08);cursor:pointer;display:grid;place-items:center;transition:background .2s,transform .3s var(--ease)}
.pback:hover{background:var(--hound);transform:translateX(-2px)}
.ptitle{display:grid;line-height:1.2;min-width:0}
.ptitle span{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.ptitle strong{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.screen{flex:1;display:grid;place-items:center;padding:0 var(--gutR) calc(16px + env(safe-area-inset-bottom,0px)) var(--gut);min-height:0}
.screen .frame{width:min(100%,calc((100vh - 110px) * 16 / 9));aspect-ratio:16/9;max-width:100%;border-radius:6px;overflow:hidden;background:#000;box-shadow:0 0 0 1px #1a1a1a,0 0 80px rgba(211,38,46,.18)}
.screen iframe{width:100%;height:100%;border:0;display:block}

.imdb{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--fg);font-weight:800}
.imdb i{font-style:normal;background:#f5c518;color:#000;font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:12px;letter-spacing:-.02em;padding:2px 5px;border-radius:3px;line-height:1.2}
.imdb .star{color:#f5c518;font-size:14px}
.imdb small{color:var(--dim);font-weight:600;font-size:12px}
.imdb:hover i{box-shadow:0 0 0 2px rgba(245,197,24,.35)}
/* Ratings */
.rate{display:grid;gap:10px}
.stars{display:flex;gap:2px;flex-wrap:wrap}
.stars .s{border:0;background:none;padding:2px;font-size:26px;line-height:1;color:#3a302d;cursor:pointer;transition:color .15s,transform .2s var(--ease)}
.stars .s.on{color:#f5c518}
.stars:not(.locked):hover .s{color:#f5c518}
.stars:not(.locked) .s:hover ~ .s{color:#3a302d}
.stars:not(.locked) .s:hover{transform:scale(1.25)}
.stars.locked .s{cursor:not-allowed;opacity:.5}
.hint{margin:0;font-size:13px;color:var(--muted)}
.hint b{color:var(--fg)}
.votes{color:var(--dim);font-size:12px;font-weight:600;margin-left:6px}
.endcard{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.82);backdrop-filter:blur(6px);animation:rise .5s var(--ease) both;padding:20px}
.endcard>div{display:grid;gap:14px;justify-items:center;text-align:center}
.endcard h5{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,44px);letter-spacing:.03em;line-height:1}
.endcard .stars .s{font-size:clamp(24px,3.4vw,34px)}
.endcard .btn{padding:9px 18px;font-size:14px}
.frame{position:relative}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:200;transform:translate(-50%,20px);opacity:0;background:var(--fg);color:#0b0908;font-weight:800;padding:10px 18px;border-radius:999px;transition:opacity .3s var(--ease),transform .4s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

footer{padding:24px var(--gutR) 40px var(--gut);border-top:1px solid var(--line);color:var(--dim);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<header class="bar" id="bar">
  <a class="brand" href="#/" aria-label="Red Hound Studios home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#d3262e" d="M4 6l5 3 4-1 4 2 6-1 5 4-1 4-4 1-1 4 2 6h-4l-3-5-4 1-2 4H7l2-6-3-4 1-5z"/><circle cx="21" cy="12" r="1.3" fill="#0b0908"/></svg>
    <b>RED HOUND</b><span>STUDIOS</span>
  </a>
  <nav class="nav" id="nav"></nav>
  <button class="bell" id="bell" aria-label="Updates" aria-expanded="false" aria-controls="updates">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
    <span class="n" hidden>0</span>
  </button>
</header>
<div class="updates" id="updates" role="region" aria-label="Updates"></div>

<div id="app">
<section class="hero" id="top">
  <div class="hero-art"><img id="still" alt="" aria-hidden="true"><canvas id="fx" aria-hidden="true"></canvas></div>
  <div class="hero-in" id="hero"></div>
</section>

<main id="rows"></main>
</div>

<footer>
  <span>Red Hound Studios · fan-made films. Not affiliated with any rights holders.</span>
  <span id="count"></span>
</footer>

<div class="player" id="player" role="dialog" aria-modal="true" aria-label="Video player">
  <div class="player-top">
    <button class="pback" id="pclose" aria-label="Close player"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ptitle"><span id="pfr"></span><strong id="pname"></strong></div>
  </div>
  <div class="screen" id="screen"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="firebase-config.js"></script>
<script>
/* ---------- Catalogue ----------
   Add a film: add an object to FILMS.
   youtube = the video ID from the watch URL (the part after v=).
   rating  = IMDb score when imdb is set; otherwise the studio's starting score,
             which viewer ratings then pull up or down.
   Optional: poster, imdb, year, runtime, rating, genres[], description, lore. */
const FRANCHISES = [
  { id:"ghostbusters",     name:"Ghostbusters",     glow:"#7ee06a", blurb:"Red Hound's longest-running series" },
  { id:"pool-shark",       name:"Pool Shark",       glow:"#2fb7e0", blurb:"", popular:true },
  { id:"dead-by-daylight", name:"Dead by Daylight", glow:"#e8662f", blurb:"" }
];

/* ---------- Actors ----------
   From the Ghostbusters 'n' more cast page.
   films = ids of films they appear in ("all" = every released film on the site).
   crew  = behind-the-camera credits: [{ film, role }]. */
const ACTORS = [
  { id:"raghuvir", name:"Raghuvir Bhardwaj", films:"all",
    youtube:["stuffisrealgood"],
    bio:"The creator of it all. Ghostbusters 1 started out as something we wanted to do for fun. Raghuvir has starred in every single Ghostbusters movie, and if he doesn't appear in some, that means he is the cameraman or director. Now we're running a fully operational business!" },
  { id:"yash", name:"Yash", films:["gb-1"],
    bio:"Yash is a former member of the Ghostbusters, and last appeared Ghostbusters 3, but in terms of deleted movies, he was in the deleted version of Ghostbusters 6 too. He shifted to chennai, breaking hearts of many fans. You will be remembered (for your goofyness, and for your looking back!)" },
  { id:"abeer", name:"Abeer", films:["gb-1","gb-severance","gb-united","gb-return"],
    bio:"He's a goofy and fun guy, that gave the films a sense of humor and provided a few ideas (like the easter egg in GB 1). His smiling does not help, though. \"That looks like my grandpa, dude!\" Abeer has appeared in every Ghostbusters film apart from Ghostbusters 4, Ghostbusters: New Guy and Ghostbusters: Haunting Hour." },
  { id:"abhiraj", name:"Abhiraj", films:["gb-united"],
    bio:"Was the camerman for the first ever Ghostbusters movie. He made his first appearance in Ghostbusters 4, and continued to appear in the movies until Ghostbusters 6. 4 movies later, he stars as one of the main characters in the 10th movie, and then never to be seen again later." },
  { id:"eenu", name:"Eenu", films:[],
    bio:"Famous for his \"I'm here to help!\" line, Eenu was in the ending of Ghostbusters 2 and was in the deleted Ghostbusters 6." },
  { id:"vedaant", name:"Vedaant Bhalla", films:[], role:"Editor & special effects",
    youtube:["WinterDeckStudios-New","WarpedAnimation"],
    bio:"The editor and special effects editor for Ghostbusters 3, which was the original \"best edited\" of the franchise. He was also supposed to do the CGI for The Last Dance, but thats on Raghuvir Bhardwaj now." },
  { id:"ivaan", name:"Ivaan", films:["gb-united","gb-return","gb-haunting-hour"],
    bio:"Ivaan made his first appearance in Ghostbusters 4. He then appeared in the 5th, 6th, 7th, 8th installment, before taking a one movie break and returning in the 10th, 11th and 13th installment. He's in the latest installment." },
  { id:"advik", name:"Advik", films:[], role:"Director, Ghostbusters 2",
    youtube:["tanookitail715"],
    bio:"He directed Ghostbusters 2, and also appeared as a cameo. He also took part in a few films that were deleted/scrapped." },
  { id:"joshua", name:"Joshua", films:["gb-return"],
    bio:"Joshua has appeared 2 times throughout the franchise's course, with the first one being in Ghostbusters 6, and Ghostbusters: Return From 24'. He's not been seen since." },
  { id:"jordan", name:"Jordan", films:["gb-return"],
    bio:"Jordan has also appeared 2 times throughout the franchise's course, with the first one being in Ghostbusters 6, and Ghostbusters: Return From 24'. He had a unique scene in Return From 24' where he threw magical swords at the monster instead of a typical proton beam." },
  { id:"aarav", name:"Aarav", films:["gb-new-guy","ps-3"],
    bio:"He's appeared twice in the Ghostbusters franchise, once in Ghostbusters 6 and the other in Ghostbusters: New Guy. He was also one of the main characters in one of our most popular movies, Pool Shark 3." },
  { id:"saurish", name:"Saurish", films:[],
    bio:"He's just a guy. Don't question it. And we did not tell him to say \"We will rule the world for our masters\". It is still a mystery to this day why he said that and what it means." },
  { id:"suveer", name:"Suveer", films:[],
    bio:"He's taken part once in the Ghostbusters franchise, famous for his \"Wait, I'm dead\" line. He appeared in a scrapped Ghostbusters 9 (it was scrapped because he stole our equipment)." },
  { id:"samarth", name:"Samarth", films:[],
    bio:"Apearing in brief moments, this dude ruined Ghostbusters 6 by bieng crazy and distracting others." },
  { id:"greg", name:"Greg", films:[],
    bio:"He took part with samarth to destroy Ghostbusters 6." },
  { id:"viaan", name:"Viaan", films:[],
    bio:"The guy who got squished in Ghostbusters 6." },
  { id:"abheevir", name:"Abheevir", films:["gb-united","gb-haunting-hour"],
    bio:"His first appearance was in Ghostbusters 4, and second in Ghostbusters: The Return. He's been in many cancelled films, and made his next few appearences in Ghostbusters: A Killer's Day, Ghostbusters: United and Ghostbusters: Haunting Hour." },
  { id:"kaviish", name:"Kaviish Mehta", films:["gb-return","gb-new-guy"],
    crew:[{ film:"ps-3", role:"Cameraman" }] }
];

/* Most popular films, in order. */
const TOP5 = ["ps-2", "ps-1", "ps-3", "dbd-1", "gb-return"];

const FILMS = [
  /* Ghostbusters */
  { id:"gb-1", franchise:"ghostbusters", installment:1,
    title:"Ghostbusters", short:"Ghostbusters",
    youtube:"3-Fy9avW1Fs", poster:"posters/ghostbusters.png",
    imdb:"https://www.imdb.com/title/tt37317422/", rating:4.3, runtime:"2m 28s" },
  { id:"gb-severance", franchise:"ghostbusters", installment:9,
    title:"Ghostbusters: Severance", short:"Severance",
    youtube:"E6P3YpHc-hM", poster:"posters/ghostbusters-severance.webp",
    rating:5.9 },
  { id:"gb-united", franchise:"ghostbusters", installment:10,
    title:"Ghostbusters: United", short:"United",
    youtube:"IEJmDwjZMv0", poster:"posters/ghostbusters-united.webp",
    imdb:"https://www.imdb.com/title/tt39434006/", rating:6.2,
    year:"Jan 2026", runtime:"6m 7s" },
  { id:"gb-return", franchise:"ghostbusters", installment:11,
    title:"Ghostbusters: Return from 24'", short:"Return from 24'",
    youtube:"hUmzqnDOeF8", poster:"posters/ghostbusters-return-from-24.webp",
    imdb:"https://www.imdb.com/title/tt39423193/", rating:4.2,
    year:"Jan 12, 2026", runtime:"2m 33s", views:163 },
  { id:"gb-new-guy", franchise:"ghostbusters", installment:12,
    title:"Ghostbusters: New Guy", short:"New Guy",
    youtube:"TJ_Jm1yP79E", poster:"posters/ghostbusters-new-guy.png",
    rating:3.4, runtime:"3m 11s" },
  { id:"gb-haunting-hour", franchise:"ghostbusters", installment:13,
    title:"Ghostbusters: Haunting Hour", short:"Haunting Hour",
    youtube:"EekKzH1vIvY", poster:"posters/ghostbusters-haunting-hour.png",
    rating:3.5, year:"May 2026", runtime:"2m 9s" },

  { id:"gb-last-dance", franchise:"ghostbusters", upcoming:true,
    title:"Ghostbusters: The Last Dance", short:"The Last Dance",
    poster:"posters/ghostbusters-the-last-dance.png", release:"Late 2026 – early 2027",
    description:"Ghostbusters: The Last Dance will be the final installment in the Ghostbusters franchise. A release is hoped for late 2026 to early 2027.",
    /* Followers see new entries here under the bell. Newest last. */
    updates:[
      { date:"2026-11-27", text:"Announced as the final installment in the Ghostbusters franchise. A release is hoped for late 2026 to early 2027." }
    ] },

  /* Pool Shark */
  { id:"ps-1", franchise:"pool-shark", installment:1,
    title:"Pool Shark", short:"Pool Shark",
    youtube:"vxOHSg3ikmI", poster:"posters/pool-shark.webp",
    rating:4, year:"Apr 21, 2026", runtime:"34s", views:334 },
  { id:"ps-2", franchise:"pool-shark", installment:2,
    title:"Pool Shark 2", short:"Pool Shark 2",
    youtube:"BgnGkhVsaQk", poster:"posters/pool-shark-2.webp",
    rating:2.7, year:"Apr 2026", runtime:"52s", views:566 },
  { id:"ps-3", franchise:"pool-shark", installment:3,
    title:"Pool Shark 3", short:"Pool Shark 3",
    youtube:"zVfUK2aeWkY", poster:"posters/pool-shark-3.webp", views:266 },

  /* Dead by Daylight */
  { id:"dbd-1", franchise:"dead-by-daylight", installment:1,
    title:"Dead by Daylight", short:"Dead by Daylight",
    youtube:"cw12Bmfbfqk", poster:"posters/dead-by-daylight.webp",
    rating:4.5, runtime:"59s", views:195 }
];

/* Film shown in the big banner at the top. */
const FEATURED = "gb-haunting-hour";

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fr = id => FRANCHISES.find(f => f.id === id);
const playIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const infoIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5"/></svg>';
const slugify = t => t.toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
FILMS.forEach(f => { f.slug = slugify(f.title); });
const RELEASED = FILMS.filter(f => !f.upcoming);
const UPCOMING = FILMS.filter(f => f.upcoming);
ACTORS.forEach(a => { if (a.films === 'all') a.films = RELEASED.map(f => f.id); a.crew = a.crew || []; });
const byInst = (a, b) => (a.installment || 0) - (b.installment || 0);
const filmsOf = F => RELEASED.filter(f => f.franchise === F.id).sort(byInst);
const castOf = f => ACTORS.filter(a => a.films.includes(f.id));
const crewOf = f => ACTORS.flatMap(a => a.crew.filter(c => c.film === f.id).map(c => ({ a, role:c.role })));
const urlFilm = f => `#/film/${f.slug}`;
const urlActor = a => `#/actor/${a.id}`;
const urlFr = F => `#/franchise/${F.id}`;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const ordinal = n => n + (['th','st','nd','rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || 'th');

function posterHTML(f){
  if (f.poster) return `<img src="${f.poster}" alt="${esc(f.title)} poster">`;
  const F = fr(f.franchise);
  return `<div class="gp" style="--glow:${F.glow}">
    <div class="stu">Red Hound Studios</div>
    <div class="num">${f.installment ?? ''}</div>
    <div><div class="t1">${esc(F.name.toUpperCase())}</div><div class="t2">${esc((f.short || f.title).toUpperCase())}</div></div>
  </div>`;
}
function featured(){
  return FILMS.find(f => f.id === FEATURED) || FILMS[FILMS.length - 1];
}
function scoreBadge(f){
  if (f.imdb && f.rating != null)
    return `<a class="imdb" data-score="${f.id}" href="${f.imdb}" target="_blank" rel="noopener" title="View on IMDb"><i>IMDb</i>${fmt(f.rating)}<small>/10</small></a>`;
  const sc = score(f);
  if (sc == null) return `<span data-score="${f.id}"></span>`;
  return `<span class="imdb" data-score="${f.id}" title="Studio score blended with viewer ratings"><b class="star">★</b>${fmt(sc)}<small>/10</small></span>`;
}
function metaHTML(f, withFranchise = true){
  const F = fr(f.franchise), bits = [];
  if (withFranchise) bits.push(`<a class="chip" href="${urlFr(F)}" style="text-decoration:none">${esc(F.name)}</a>`);
  if (f.installment) bits.push(`<span>Part ${f.installment}</span>`);
  if (f.year) bits.push(`<span>${esc(f.year)}</span>`);
  if (f.runtime) bits.push(`<span>${esc(f.runtime)}</span>`);
  if (f.rating != null || f.id in Ratings.agg) bits.push(scoreBadge(f));
  return bits.join('');
}
function titleHTML(t){
  const [lead, rest] = t.includes(':') ? t.split(/:\s*/) : [null, t];
  return `${lead ? `<small>${esc(lead)}</small>` : ''}${esc(rest)}`;
}
function cardHTML(f, cap = 'part'){
  const right = cap === 'views' ? (f.views ? f.views.toLocaleString() + ' views' : '')
              : cap === 'franchise' ? esc(fr(f.franchise).name)
              : (f.installment ? '#' + f.installment : '');
  return `<a class="card" href="${urlFilm(f)}" aria-label="${esc(f.title)}">
    <div class="poster">${posterHTML(f)}</div>
    <div class="cap"><span>${esc(f.short || f.title)}</span><span>${right}</span></div></a>`;
}
function actorChip(a, subOverride){
  const n = a.films.length;
  const sub = subOverride || a.role || (n ? plural(n, 'film') : (a.crew.length ? 'Crew' : ''));
  return `<a class="actor" href="${urlActor(a)}" aria-label="${esc(a.name)}">
    <div class="face"><img src="cast/${a.id}.jpg" alt="" loading="lazy"></div>
    <div><b>${esc(a.name)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</div></a>`;
}
function rowHTML(id, title, sub, inner, extra = '', see = ''){
  return `<section class="row" ${id ? `id="${id}"` : ''}>
    <div class="row-h"><span class="tag" style="background:var(--tagc,var(--hound))"></span><h2>${esc(title)}</h2>${extra}${sub ? `<p>${sub}</p>` : ''}${see}</div>
    ${inner}</section>`;
}
const track = items => `<div class="track">${items.join('')}</div>`;
const seeAll = (href, label = 'See all') => `<a class="see" href="${href}">${label} ›</a>`;

/* ---------- Following upcoming films ----------
   Followed films and seen updates are remembered in this browser. */
const Follow = {
  ids: new Set(), seen: new Set(),
  load(){ this.ids = new Set(ls.get('rh-follow', [])); this.seen = new Set(ls.get('rh-seen', [])); },
  key: (f, u) => `${f.id}@${u.date}@${u.text.length}`,
  save(){ ls.set('rh-follow', [...this.ids]); ls.set('rh-seen', [...this.seen]); },
  toggle(id){
    const f = FILMS.find(x => x.id === id); if (!f) return;
    if (this.ids.has(id)) { this.ids.delete(id); toast(`Unfollowed ${f.short || f.title}`); }
    else { this.ids.add(id); (f.updates || []).forEach(u => this.seen.add(this.key(f, u)));
      toast(`Following ${f.short || f.title}. New updates appear under the bell.`); }
    this.save(); this.paint();
  },
  feed(){
    return FILMS.filter(f => this.ids.has(f.id)).flatMap(f => (f.updates || []).map(u => ({ f, u, unread: !this.seen.has(this.key(f, u)) })))
      .sort((a, b) => b.u.date.localeCompare(a.u.date));
  },
  markRead(){ this.feed().forEach(x => this.seen.add(this.key(x.f, x.u))); this.save(); this.paint(); },
  paint(){
    const unread = this.feed().filter(x => x.unread).length;
    const n = $('#bell .n'); n.textContent = unread; n.hidden = !unread;
    $('#bell').setAttribute('aria-label', unread ? `Updates, ${unread} new` : 'Updates');
    document.querySelectorAll('[data-follow]').forEach(b => {
      const on = this.ids.has(b.dataset.follow);
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
      b.innerHTML = on ? '✓ Following' : '+ Follow';
    });
    const feed = this.feed();
    $('#updates').innerHTML = `<h4>Updates</h4>${feed.length ? feed.map(x => `
      <a class="upd${x.unread ? ' new' : ''}" href="${urlFilm(x.f)}">
        <span class="when">${esc(fmtDate(x.u.date))} · ${esc(x.f.short || x.f.title)}</span>${esc(x.u.text)}</a>`).join('')
      : `<p class="none">${this.ids.size ? 'No updates yet.' : 'Follow an upcoming film to get its updates here.'}</p>`}
      ${UPCOMING.length ? `<a class="see" href="#/#row-soon" style="margin:0">Coming soon ›</a>` : ''}`;
  }
};
const fmtDate = d => new Date(d + 'T12:00:00').toLocaleDateString(undefined, { day:'numeric', month:'short', year:'numeric' });
const followBtn = f => `<button class="btn ghost follow" data-follow="${f.id}" aria-pressed="false">+ Follow</button>`;
function soonCard(f){
  return `<div class="soon">
    <a class="poster" href="${urlFilm(f)}" aria-label="${esc(f.title)}">${posterHTML(f)}</a>
    <div class="soon-body">
      <span class="chip soon-chip">Coming soon</span>
      <a href="${urlFilm(f)}" class="soon-t">${esc(f.title)}</a>
      ${f.release ? `<span class="soon-r">${esc(f.release)}</span>` : ''}
      ${f.description ? `<p>${esc(f.description)}</p>` : ''}
      <div class="actions">${followBtn(f)}</div>
    </div></div>`;
}

/* ---------- Hero ---------- */
let heroNum = '';
function setHero({ still = null, soft = false, num = '', cls = '', html }){
  $('#top').className = 'hero ' + cls;
  heroNum = String(num || '');
  const im = $('#still');
  im.classList.remove('on'); im.classList.toggle('soft', soft);
  im.onload = im.onerror = null;
  if (!still) { im.removeAttribute('src'); }
  else {
    const urls = Array.isArray(still) ? still.slice() : [still];
    const next = () => { const u = urls.shift(); if (u) im.src = u; };
    im.onload = () => { if (im.naturalWidth <= 120 && urls.length) return next(); requestAnimationFrame(() => im.classList.add('on')); };
    im.onerror = next;
    im.removeAttribute('src'); next();
  }
  $('#hero').className = 'hero-in' + (cls.includes('sub') ? ' wide' : '');
  $('#hero').innerHTML = html;
}
const ytStill = id => [`https://i.ytimg.com/vi/${id}/maxresdefault.jpg`, `https://i.ytimg.com/vi/${id}/hqdefault.jpg`];

/* ---------- Pages ---------- */
function pageHome(){
  const feat = featured(), F = fr(feat.franchise);
  setHero({ still: feat.youtube ? ytStill(feat.youtube) : null, num: feat.installment, html: `
    <div class="eyebrow"><span class="dot"></span>Latest premiere · ${esc(F.name)}</div>
    <h1 tabindex="-1">${titleHTML(feat.title)}</h1>
    <div class="meta">${metaHTML(feat)}</div>
    <div class="actions">
      ${feat.youtube ? `<button class="btn play" data-play="${feat.id}">${playIcon}Play</button>` : ''}
      <a class="btn ghost" href="${urlFilm(feat)}">${infoIcon}More info</a>
    </div>` });

  const top = TOP5.map(id => FILMS.find(f => f.id === id)).filter(Boolean);
  const topRow = top.length ? `<section class="row top" id="row-top" style="--tagc:#f5c518">
      <div class="row-h"><span class="tag" style="background:#f5c518"></span><h2>Top 5 most popular</h2><p>Ranked by views</p></div>
      <div class="track">${top.map((f, i) => `
        <a class="card" href="${urlFilm(f)}" aria-label="Number ${i+1}: ${esc(f.title)}">
          <span class="rank rank-${i+1}" aria-hidden="true">${i+1}</span>
          <div><div class="poster">${posterHTML(f)}</div>
            <div class="cap"><span>${esc(f.short || f.title)}</span><span class="views">${f.views ? f.views.toLocaleString() + ' views' : ''}</span></div></div>
        </a>`).join('')}</div></section>` : '';
  const frRows = FRANCHISES.map(F => {
    const list = filmsOf(F);
    return `<div style="--tagc:${F.glow}">${rowHTML(`row-${F.id}`, F.name,
      `${plural(list.length, 'film')}${F.blurb ? ' · ' + esc(F.blurb) : ''}`,
      list.length ? track(list.map(f => cardHTML(f))) : `<div class="empty"><strong>No ${esc(F.name)} films uploaded yet.</strong></div>`,
      F.popular ? '<span class="pop">★ Most popular franchise</span>' : '', seeAll(urlFr(F), 'Franchise page'))}</div>`;
  }).join('');

function resolve(h){
  let m;
  if ((m = /^#\/film\/([\w-]+)$/.exec(h))) { const f = FILMS.find(x => x.slug === m[1] || x.id === m[1]); if (f) return () => pageFilm(f); }
  if ((m = /^#\/actor\/([\w-]+)$/.exec(h))) { const a = ACTORS.find(x => x.id === m[1]); if (a) return () => pageActor(a); }
  if ((m = /^#\/franchise\/([\w-]+)$/.exec(h))) { const F = fr(m[1]); if (F) return () => pageFranchise(F); }
  if (h === '#/actors') return pageActors;
  if (h === '#/#row-soon') return () => { const t = pageHome(); requestAnimationFrame(() => { const el = $('#row-soon'); el && scrollTo(0, el.getBoundingClientRect().top + scrollY - 80); }); return t; };
  return pageHome;
}
const history_ = [], scrollMem = {};
let firstRoute = true;
function route(){
  const h = location.hash || '#/';
  const back = history_.length > 1 && history_[history_.length - 2] === h;
  if (history_.length) scrollMem[history_[history_.length - 1]] = scrollY;
  if (back) history_.pop(); else if (history_[history_.length - 1] !== h) history_.push(h);
  const show = () => {
    document.title = resolve(h)();
    document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('cur', a.getAttribute('href') === h));
    scrollTo(0, back ? (scrollMem[h] || 0) : 0);
    $('#app').classList.remove('leaving');
    Follow.paint();
    if (!firstRoute) { const t = document.querySelector('#hero h1'); t && t.focus({ preventScroll:true }); }
    firstRoute = false;
  };
  if (firstRoute) return show();
  if ($('#player').classList.contains('on')) closePlayer();
  $('#app').classList.add('leaving');
  setTimeout(show, 200);
}

/* ---------- Player ----------
   Uses the YouTube IFrame API so the site knows when a film has been watched
   (90% or the end), which unlocks rating it. */
let ytp = null, watchTimer = null, ytReady = null;
function loadYT(){
  if (ytReady) return ytReady;
  ytReady = new Promise((res, rej) => {
    if (window.YT && YT.Player) return res();
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { prev && prev(); res(); };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = rej;
    document.head.appendChild(tag);
    setTimeout(() => rej(new Error('timeout')), 6000);
  });
  ytReady.catch(() => { ytReady = null; });
  return ytReady;
}
function secs(rt){
  if (!rt) return 0;
  const m = /(\d+)\s*m/.exec(rt), sec = /(\d+)\s*s/.exec(rt);
  return (m ? +m[1]*60 : 0) + (sec ? +sec[1] : 0);
}
function playFilm(id){
  const f = FILMS.find(x => x.id === id); if (!f || !f.youtube) return;
  $('#pfr').textContent = fr(f.franchise).name + (f.installment ? ` · Part ${f.installment}` : '');
  $('#pname').textContent = f.title;
  $('#screen').innerHTML = `<div class="frame"><div id="yt"></div><div class="endcard" id="endcard" hidden></div></div>`;
  $('#player').classList.add('on');
  document.body.style.overflow = 'hidden';
  $('#pclose').focus({preventScroll:true});

  const vars = { autoplay:1, rel:0, modestbranding:1, playsinline:1 };
  loadYT().then(() => {
    if (!$('#yt')) return;
    ytp = new YT.Player('yt', {
      host:'https://www.youtube-nocookie.com', videoId:f.youtube, playerVars:vars, width:'100%', height:'100%',
      events:{ onStateChange: e => { if (e.data === YT.PlayerState.ENDED) { Ratings.markWatched(f.id); showEndcard(f); } } }
    });
    watchTimer = setInterval(() => {
      try { const d = ytp.getDuration(), c = ytp.getCurrentTime(); if (d > 0 && c / d >= 0.9) Ratings.markWatched(f.id); } catch(_){}
    }, 1000);
  }).catch(() => {
    // API unavailable: plain embed, and count it as watched after 90% of the runtime.
    if (!$('#yt')) return;
    $('#yt').outerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${f.youtube}?autoplay=1&rel=0&modestbranding=1&playsinline=1" title="${esc(f.title)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    const t = secs(f.runtime);
    if (t) watchTimer = setTimeout(() => Ratings.markWatched(f.id), t * 900);
  });
}
function showEndcard(f){
  const ec = $('#endcard'); if (!ec) return;
  const mine = Ratings.mine[f.id];
  ec.innerHTML = `<div>
    <div class="eyebrow"><span class="dot"></span>You finished it</div>

    <button class="btn ghost" id="endskip">Close</button>

}
function closePlayer(){
  $('#player').classList.remove('on');
  clearInterval(watchTimer); clearTimeout(watchTimer); watchTimer = null;
  setTimeout(() => {
    if ($('#player').classList.contains('on')) return;

/* ---------- Ratings ----------
   Every vote is kept on the viewer's device. When firebase-config.js holds a
   Firebase project config, votes are also shared, so everyone's ratings count. */
const BASE_WEIGHT = 5; // the studio's starting score counts as this many viewer votes
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(_){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} }
};
const Ratings = {
  watched: new Set(ls.get('rh-watched', [])),
  mine: ls.get('rh-mine', {}),
  agg: {},          // film id -> {sum, count}
  shared: false, db: null, uid: null,

  localAgg(){
    if (this.shared) return;
    this.agg = {};
    for (const [id, n] of Object.entries(this.mine)) this.agg[id] = { sum:n, count:1 };
  },
  markWatched(id){
    if (this.watched.has(id)) return;
    this.watched.add(id); ls.set('rh-watched', [...this.watched]);
    refreshRatings();
  },
  vote(id, n){
    if (!this.watched.has(id) || !(n >= 1 && n <= 10)) return;
    this.mine[id] = n; ls.set('rh-mine', this.mine);
    if (this.shared && this.uid) {
      this.db.collection('ratings').doc(`${id}_${this.uid}`)
        .set({ film:id, uid:this.uid, score:n, at: firebase.firestore.FieldValue.serverTimestamp() })
        .catch(() => toast('Couldn\'t save your rating online. It\'s kept on this device.'));
    } else this.localAgg();
    const f = FILMS.find(x => x.id === id);
    toast(`Rated ${f ? (f.short || f.title) : ''} ${n}/10`);
    refreshRatings();
  },
  async connect(){
    const cfg = window.RH_FIREBASE;
    if (!cfg || !cfg.apiKey) return;
    const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}/`;
    for (const m of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])
      await new Promise((res, rej) => { const t = document.createElement('script'); t.src = base + m; t.onload = res; t.onerror = rej; document.head.appendChild(t); });
    firebase.initializeApp(cfg);
    const cred = await firebase.auth().signInAnonymously();
    this.uid = cred.user.uid;
    this.db = firebase.firestore();
    this.db.collection('ratings').onSnapshot(snap => {
      const agg = {}, mineServer = {};
      snap.forEach(d => {
        const r = d.data();
        if (!FILMS.some(f => f.id === r.film) || !(r.score >= 1 && r.score <= 10)) return;
        (agg[r.film] ||= { sum:0, count:0 }); agg[r.film].sum += r.score; agg[r.film].count++;
        if (r.uid === this.uid) mineServer[r.film] = r.score;
      });
      // Votes made on this device before sharing was switched on get uploaded once.
      for (const [id, n] of Object.entries(this.mine)) if (!(id in mineServer)) {
        this.db.collection('ratings').doc(`${id}_${this.uid}`).set({ film:id, uid:this.uid, score:n, at: firebase.firestore.FieldValue.serverTimestamp() }).catch(()=>{});
      }
      this.mine = { ...this.mine, ...mineServer }; ls.set('rh-mine', this.mine);
      this.agg = agg; this.shared = true;
      refreshRatings();
    }, () => {});
  }
};
Ratings.localAgg();

function fmt(n){ return (Math.round(n * 10) / 10).toFixed(1); }
function score(f){
  const a = Ratings.agg[f.id] || { sum:0, count:0 };
  if (f.rating == null) return a.count ? a.sum / a.count : null;
  return (f.rating * BASE_WEIGHT + a.sum) / (BASE_WEIGHT + a.count);
}
function votesHTML(f){
  const a = Ratings.agg[f.id];
  if (!a || !a.count || !Ratings.shared) return `<span data-votes="${f.id}"></span>`;
  const avg = fmt(a.sum / a.count);
  const txt = f.imdb ? `Red Hound viewers: ${avg} (${a.count})` : `${a.count} viewer ${a.count === 1 ? 'rating' : 'ratings'}`;
  return `<span class="votes" data-votes="${f.id}">${txt}</span>`;
}
function starsHTML(f, locked){
  const m = Ratings.mine[f.id] || 0;
  return `<div class="stars${locked ? ' locked' : ''}" role="group" aria-label="Rate ${esc(f.title)} out of 10">${
    Array.from({length:10}, (_, i) => i + 1).map(n => locked
      ? `<span class="s" aria-hidden="true">★</span>`
      : `<button class="s${n <= m ? ' on' : ''}" data-vote="${f.id}" data-n="${n}" aria-label="${n} out of 10">★</button>`
    ).join('')}</div>`;
}
function rateHTML(f){
  const watched = Ratings.watched.has(f.id), m = Ratings.mine[f.id];
  const note = f.imdb ? ' Viewer ratings are shown beside the IMDb score and don\'t change it.' : '';
  const hint = !watched ? 'Watch the film to rate it.'
    : m ? `You rated it <b>${m}/10</b>. Tap a star to change it.${note}` : `Tap a star to rate it out of 10.${note}`;
  return `<div class="sec rate" data-rate="${f.id}"><h4>Your rating</h4>${starsHTML(f, !watched)}<p class="hint">${hint}</p></div>`;
}
function refreshRatings(){
  const byId = id => FILMS.find(f => f.id === id);
  document.querySelectorAll('[data-score]').forEach(el => { const f = byId(el.dataset.score); if (f) el.outerHTML = scoreBadge(f); });
  document.querySelectorAll('[data-votes]').forEach(el => { const f = byId(el.dataset.votes); if (f) el.outerHTML = votesHTML(f); });
  document.querySelectorAll('[data-rate]').forEach(el => { const f = byId(el.dataset.rate); if (f) el.outerHTML = rateHTML(f); });
  const ec = $('#endcard');
  if (ec && !ec.hidden) {
    const id = ec.querySelector('[data-vote]')?.dataset.vote, f = byId(id), m = Ratings.mine[id];
    if (f) { ec.querySelector('.stars').outerHTML = starsHTML(f, false);
      ec.querySelector('[data-endhint]').innerHTML = m ? `Thanks! You rated it <b>${m}/10</b>.` : 'Tap a star to rate it out of 10.'; }
  }
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200);
}

/* ---------- Hero ambience: drifting spectral haze ---------- */
(function(){
  const c = $('#fx'), x = c.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, t = 0;
  const blobs = Array.from({length:7}, (_,i) => ({
    x: Math.random(), y: .3 + Math.random()*.7, r: .25 + Math.random()*.35,
    s: .0004 + Math.random()*.0008, p: Math.random()*6.28,
    col: i % 3 === 0 ? [126,224,106] : [211,38,46]
  }));
  function size(){ const d = Math.min(devicePixelRatio||1, 2); w = c.width = c.offsetWidth*d; h = c.height = c.offsetHeight*d; }
  function frame(){
    x.clearRect(0,0,w,h);
    x.globalCompositeOperation = 'lighter';
    for (const b of blobs){
      const bx = (b.x + Math.sin(t*b.s*6 + b.p)*.12) * w;
      const by = (b.y + Math.cos(t*b.s*4 + b.p)*.08) * h;
      const r = b.r * Math.max(w,h);
      const g = x.createRadialGradient(bx,by,0,bx,by,r);
      const a = b.col[0] === 126 ? .14 : .22;
      g.addColorStop(0, `rgba(${b.col},${a})`); g.addColorStop(1, 'rgba(0,0,0,0)');
      x.fillStyle = g; x.beginPath(); x.arc(bx,by,r,0,6.283); x.fill();
    }
    x.globalCompositeOperation = 'source-over';
    // big ghosted installment numeral
    x.font = `${h*.95}px "Bebas Neue", Impact, sans-serif`;
    x.textAlign = 'right'; x.textBaseline = 'alphabetic';
    x.strokeStyle = 'rgba(243,237,233,.07)'; x.lineWidth = Math.max(1, w/900);
    if (heroNum) x.strokeText(heroNum, w*.96 + Math.sin(t*.003)*6, h*.95);
    t++;
    if (!reduce) requestAnimationFrame(frame);
  }
  size(); new ResizeObserver(() => { size(); if (reduce) frame(); }).observe(c);
  document.fonts && document.fonts.ready.then(() => reduce && frame());
  frame();
})();

render();
Ratings.connect().catch(() => {});
</script>
